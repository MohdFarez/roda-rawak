<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rode Warne Tuka Hadioh 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111;--paper:#FFF7E8;--white:#ffffff;
  --lime:#C8FF4D;--pink:#FF5FA2;--yellow:#FFE14D;--sky:#7CC8FF;
  --muted:#6b6357;
  --b:3px solid var(--ink);--sh:5px 5px 0 var(--ink);--sh-sm:3px 3px 0 var(--ink);
  --r:18px;
  --font:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --stage:min(100%,58vh,520px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(#d8c9ad 1.3px,transparent 1.3px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- header + marquee ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px 12px}
.brand{font-weight:800;font-size:clamp(20px,3vw,28px);letter-spacing:-.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sticker{display:inline-block;font-size:13px;font-weight:800;background:var(--lime);border:var(--b);border-radius:999px;padding:3px 10px;transform:rotate(-4deg);box-shadow:var(--sh-sm);letter-spacing:0}
.tools{display:flex;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:var(--b);background:var(--white);box-shadow:var(--sh-sm);cursor:pointer;font-size:19px;display:grid;place-items:center;transition:transform .1s,box-shadow .1s}
.icon-btn:active{transform:translate(3px,3px);box-shadow:none}
.marquee{background:var(--ink);color:var(--lime);border-block:var(--b);overflow:hidden;white-space:nowrap;font-weight:800;font-size:15px;letter-spacing:.3px}
.marquee .track{display:inline-block;padding:8px 0;animation:scroll 28s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 34px;padding:24px 22px 40px;align-items:start}
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.list-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-title{margin:0;font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-1px;line-height:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col-title .hl{display:inline-block;padding:2px 12px 4px;border:var(--b);border-radius:12px;box-shadow:var(--sh-sm);transform:rotate(-2deg)}
.col-title .hl.pink{background:var(--pink)}
.col-title .hl.sky{background:var(--sky)}
.badge{font-size:15px;font-weight:800;background:var(--yellow);border:var(--b);padding:2px 10px;border-radius:999px;letter-spacing:0}
.live{font-size:13px;font-weight:800;background:var(--white);border:2.5px solid var(--ink);padding:3px 10px;border-radius:999px;letter-spacing:0}
.live.off{background:#ffd6d6}

.card{background:var(--white);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);padding:16px;width:100%}
.btn{border:var(--b);background:var(--white);padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .1s,box-shadow .1s}
.btn:hover{background:#fffbe9}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lime{background:var(--lime)}
.btn.pink{background:var(--pink)}

/* ---------- status + spin form ---------- */
.status{font-size:19px;font-weight:700;text-align:center;min-height:30px}
.status b{font-size:22px;font-weight:800;background:var(--lime);border:var(--b);border-radius:10px;padding:0 10px;display:inline-block;transform:rotate(-1.5deg)}
.spin-form{display:flex;gap:10px;width:var(--stage);flex-wrap:wrap}
.spin-form input{flex:1 1 200px;min-width:0;background:var(--white);border:var(--b);border-radius:14px;padding:13px 16px;font-size:18px;font-weight:700;outline:none;box-shadow:var(--sh-sm)}
.spin-form input:focus{background:#fffef5}
.spin-form input:disabled{background:#efe6d3;opacity:.8}
.spin-btn{flex:1 1 150px;font-size:19px;font-weight:800;padding:13px 22px;border-radius:14px;background:var(--pink);box-shadow:var(--sh)}
.spin-btn:active:not(:disabled){transform:translate(5px,5px)}

/* ---------- wheel ---------- */
.wheel-wrap{position:relative;width:var(--stage);aspect-ratio:1/1;margin-top:14px;container-type:inline-size}
.wheel-wrap canvas{display:block;width:100%;height:100%;border-radius:50%;filter:drop-shadow(7px 7px 0 var(--ink))}
.pointer{position:absolute;top:-20px;left:50%;width:46px;height:54px;margin-left:-23px;z-index:4;transform-origin:23px 20px;pointer-events:none}
.pointer svg{width:100%;height:100%;display:block;overflow:visible}
.pointer.flick{animation:flick .14s ease-out}
@keyframes flick{0%{transform:rotate(0)}35%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--ink);z-index:2;
  background:var(--lime);display:grid;place-items:center;font-size:13px;font-size:clamp(18px,7cqi,44px);box-shadow:4px 4px 0 var(--ink);pointer-events:none}
.lock{position:absolute;inset:0;border-radius:50%;z-index:3;display:grid;place-items:center;text-align:center;padding:16%;
  background:rgba(255,247,232,.86);font-weight:800;font-size:clamp(16px,5cqi,28px);line-height:1.25}
.lock span{display:block;font-size:.6em;font-weight:600;color:var(--muted);margin-top:8px}

/* ---------- family list ---------- */
.picks{list-style:none;margin:0;display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto;padding:2px 6px 6px 2px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--white);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.prow .no{font-size:22px;font-weight:800;min-width:36px;text-align:right}
.prow .nm{flex:1;min-width:0;font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .me{font-size:12px;font-weight:800;background:var(--ink);color:var(--lime);border-radius:999px;padding:3px 8px;white-space:nowrap;transform:rotate(-3deg)}
.prow .res{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:5px 12px;border-radius:999px;white-space:nowrap;border:2.5px solid var(--ink)}
.prow .res.none{border:0;color:var(--muted);font-weight:600;padding:5px 4px}
.prow.mine{background:#fff3f9}
.prow.fresh{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.empty{text-align:center;padding:30px 10px;border:3px dashed var(--ink);border-radius:14px;font-size:16px;font-weight:600;line-height:1.6;background:var(--paper)}
.list-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:13px;font-weight:600;color:var(--muted)}

/* ---------- presentation ---------- */
body.presenting{--stage:min(100%,66vh,860px)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(17,17,17,.55);animation:fade .2s}
.modal-card{width:min(100%,480px);background:var(--white);border:var(--b);border-radius:24px;overflow:hidden;box-shadow:9px 9px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.modal-top{padding:44px 24px 48px;text-align:center;border-bottom:var(--b)}
.kicker{margin:0 0 10px;font-size:20px;font-weight:800;word-break:break-word}
.modal-top h2{margin:0;font-size:clamp(44px,11vw,70px);line-height:1;letter-spacing:-1.5px;font-weight:800}
.sub{margin:14px 0 0;font-size:14px;font-weight:700;opacity:.8}
.modal-actions{display:flex;justify-content:flex-end;padding:18px 20px 20px}
.modal-actions .btn{font-size:16px;padding:11px 18px}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes fade{from{opacity:0}}

#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--lime);font-weight:800;font-size:15px;
  padding:11px 18px;border-radius:999px;border:3px solid var(--lime);opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  :root{--stage:min(100%,62vh)}
  main{grid-template-columns:1fr;padding:20px 14px 36px;gap:34px}
  .picks{max-height:none}
}
@media (prefers-reduced-motion:reduce){.marquee .track{animation:none}}
</style>
</head>
<body>

<header>
  <div class="brand">🎁 Rode Warne Tuka Hadioh <span class="sticker">ganu kite 🐢</span></div>
  <div class="tools">
    <button class="icon-btn" id="soundBtn" title="Bunyi">🔊</button>
    <button class="icon-btn" id="fsBtn" title="Skrin penoh">⛶</button>
  </div>
</header>
<div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

<main>
  <!-- ========== RODE ========== -->
  <section class="wheel-col">
    <h2 class="col-title"><span class="hl pink">Rode 🎡</span></h2>
    <div class="status" id="status"></div>
    <div class="wheel-wrap" id="wheelWrap">
      <div class="pointer" id="pointer">
        <svg viewBox="0 0 46 54" aria-hidden="true">
          <path d="M23 52 L5 15 A20 20 0 0 1 41 15 Z" fill="#111" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="23" cy="18" r="7" fill="#FF5FA2" stroke="#fff" stroke-width="2"/>
        </svg>
      </div>
      <canvas aria-label="Rode warne"></canvas>
      <div class="hub">🎁</div>
      <div class="lock hidden" id="lock"></div>
    </div>
    <form class="spin-form" id="spinForm" autocomplete="off">
      <input type="text" id="nameInput" maxlength="40" placeholder="Taip name mung…" enterkeyhint="go" aria-label="Name mung">
      <button class="btn spin-btn" id="spinBtn" type="submit">🌀 Pusing!</button>
    </form>
  </section>

  <!-- ========== SENARAI KELUARGA ========== -->
  <section class="list-col">
    <h2 class="col-title"><span class="hl sky">Senarai Keluarga 📋</span><span class="badge" id="count">0/11</span><span class="live" id="live">⏳</span></h2>
    <div class="card">
      <ol class="picks" id="picks"></ol>
      <div class="list-foot">
        <span class="hint" id="hint">Senarai ning update sendiri 🔄</span>
        <button class="btn" id="copyBtn">📋 Saling keputusang</button>
      </div>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-card">
    <div class="modal-top" id="modalTop">
      <p class="kicker" id="winKicker"></p>
      <h2 id="winTitle"></h2>
      <p class="sub hidden" id="winSub"></p>
    </div>
    <div class="modal-actions">
      <button class="btn pink" id="closeBtn">OK</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   DATABASE — URL Web App Google Apps Script (hujung dia /exec)
   ===================================================================== */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbyQ_HhfIwYSMXi-QvbLpCSeC7a291kDqoGadbRF9sunCU78jSErEOyaYnN-i9KOV-to/exec';

/* =====================================================================
   SEMUA AYAT KAK SINI — senang nok tukor ikut loghat kampung mung 😎
   ===================================================================== */
const T = {
  marquee: '🎁 TUKA HADIOH ✦ pusing je, jangang pikir banyok ✦ warne mung, hadioh mung ✦ no cap 🧢 ✦ slay gok 💅 ✦ ganu kite 🐢 ✦ ',
  freeLeft: n => [`🎨 `, `${n} warne`, ` lagi`],
  allTaken: '🎉 Semue warne doh ade tuang',
  lockLoading: ['⏳ Tengah amik senarai…', 'Kejap ye'],
  lockOffline: ['📡 Dok leh sambung', 'Check internet — page cube sendiri'],
  lockNoApi: ['⚙️ Database belum sambung', 'Letak URL Apps Script kak DEFAULT_API'],
  lockDone: n => ['🎉 Semue doh dapak warne!', `${n} orang doh pusing`],
  placeholder: 'Taip name mung…',
  placeholderFull: 'Doh cukup 11 orang ✅',
  spin: '🌀 Pusing!',
  spinning: '🌀 Tengah pusing…',
  empty: 'Belum ade sape-sape pusing lagi 🥲<br>Jadi orang <b>pertame</b>! 👈',
  me: '👈 mung',
  liveOn: '🟢 Live',
  liveOff: '🔴 Offline',
  hint: 'Senarai ning update sendiri 🔄',
  winKicker: name => `🎉 ${name} dapak warne`,
  existsKicker: name => `😉 ${name} doh pusing — warne die`,
  closeWin: 'Slay! 💅',
  closeExists: 'OK',
  toastTypeName: 'Taip name dulu weh 😤',
  toastFull: 'Doh cukup 11 orang 🙅',
  toastExists: 'Name tu doh ade — kalau orang laing, tamboh initial (cth: Ali B) 😉',
  existsSub: 'Kalau bukan mung, tamboh initial — cth: Ali B',
  toastNoColors: 'Warne doh habih 😅',
  toastNetwork: '📡 Internet ade masaloh — cube lagi 🙏',
  toastBusy: 'Ramai sangat pusing serentak — cube lagi 🙏',
  toastServer: 'Database ade masaloh — cube lagi kekgi 🙏',
  toastCopied: 'Doh saling! Paste kak WhatsApp 📲',
  toastCopyEmpty: 'Belum ade keputusang lagi',
  copyHeader: '🎁 Tuka Hadioh — Warne Tema',
  soundOn: 'Bunyi: on 🔊',
  soundOff: 'Bunyi: off 🔇'
};

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const POINTER = -Math.PI / 2;            // pointer at the top of the wheel
const FONT = '"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
const INK = '#111111';
const params = new URLSearchParams(location.search);
const API = params.get('api') || DEFAULT_API;
const POLL_MS = Math.max(1500, +params.get('poll') || 12000);
const LS_MINE = 'rodaWarna.mine', LS_SOUND = 'rodaWarna.sound';

const rand = (() => {
  const c = window.crypto;
  if (c && c.getRandomValues) {
    const buf = new Uint32Array(1);
    return () => { c.getRandomValues(buf); return buf[0] / 4294967296; };
  }
  return Math.random;
})();
const mod = (a, m) => ((a % m) + m) % m;
const ease = t => 1 - Math.pow(1 - t, 3);
const cleanName = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 40);
const sameName = (a, b) => cleanName(a).toLowerCase() === cleanName(b).toLowerCase();

/* ================= colours: 11 warna Tema Tukar Hadiah ================= */
const COLORS = [
  { key: 'red',    name: 'Merah',  emoji: '❤️', hex: '#FF4245' },
  { key: 'pink',   name: 'Pink',   emoji: '💗', hex: '#FF6FB5' },
  { key: 'blue',   name: 'Blue',   emoji: '💙', hex: '#0091FF' },
  { key: 'purple', name: 'Ungu',   emoji: '💜', hex: '#AF52DE' },
  { key: 'green',  name: 'Hijau',  emoji: '💚', hex: '#30D158' },
  { key: 'yellow', name: 'Kuning', emoji: '💛', hex: '#FFD600' },
  { key: 'orange', name: 'Oren',   emoji: '🧡', hex: '#FF9230' },
  { key: 'white',  name: 'Putih',  emoji: '🤍', hex: '#F5F5F7' },
  { key: 'black',  name: 'Hitam',  emoji: '🖤', hex: '#1C1C1E' },
  { key: 'brown',  name: 'Coklat', emoji: '🤎', hex: '#8B5E3C' },
  { key: 'gold',   name: 'Gold',   emoji: '✨', hex: '#D4AF37', gold: true }
];
const BY_KEY = Object.fromEntries(COLORS.map(c => [c.key, c]));
const WHEEL_ORDER = ['red', 'blue', 'brown', 'white', 'pink', 'green', 'yellow', 'purple', 'orange', 'black', 'gold'];  // look-alikes kept apart
const GOLD_CSS = 'linear-gradient(135deg,#A9791C 0%,#F9E08B 38%,#E6C15A 58%,#B8892A 100%)';

function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function inkFor(c) {
  if (c.gold) return '#2b1d00';
  const [r, g, b] = hexToRgb(c.hex);
  return (r * 299 + g * 587 + b * 114) / 1000 >= 150 ? INK : '#ffffff';
}
const swatch = c => c.gold ? GOLD_CSS : c.hex;

/* ================= state ================= */
let picks = [];             // from the database: [{ name, color, time }]
let MAX = 11;
let loaded = false;         // got the list at least once
let online = true;
let busy = false;           // a spin is running
let freshName = null;
let sound = true;
let mine = [];
try { mine = JSON.parse(localStorage.getItem(LS_MINE) || '[]').filter(x => typeof x === 'string'); } catch (e) { mine = []; }
try { sound = localStorage.getItem(LS_SOUND) !== 'off'; } catch (e) {}
function rememberMine(name) {
  if (!mine.some(m => sameName(m, name))) mine.push(cleanName(name));
  try { localStorage.setItem(LS_MINE, JSON.stringify(mine.slice(-20))); } catch (e) {}
}

const takenKeys = (except) => new Set(picks.filter(p => p.color && p !== except).map(p => p.color));
function wheelColors(except) {
  const taken = takenKeys(except);
  return WHEEL_ORDER.filter(k => !taken.has(k)).map(k => BY_KEY[k]);
}
function sanitizePicks(list) {
  if (!Array.isArray(list)) return [];
  return list.filter(p => p && typeof p.name === 'string' && cleanName(p.name))
    .map(p => ({ name: cleanName(p.name), color: BY_KEY[p.color] ? p.color : null, time: String(p.time || '') }));
}

/* ================= database calls ================= */
async function call(opts, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const url = opts ? API : API + (API.includes('?') ? '&' : '?') + 't=' + Date.now();
    const res = await fetch(url, Object.assign({ signal: ctrl.signal, cache: 'no-store', redirect: 'follow' }, opts || {}));
    const data = await res.json();
    if (!data || typeof data !== 'object') throw new Error('bad');
    return data;
  } finally { clearTimeout(timer); }
}
const apiList = () => call(null, 15000);
const apiSpin = name => call({ method: 'POST', body: JSON.stringify({ action: 'spin', name }) }, 30000);   // text/plain → no CORS preflight

/* ================= sound ================= */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function playTick() {
  if (!sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(1300, t);
  o.frequency.exponentialRampToValueAtTime(520, t + 0.03);
  g.gain.setValueAtTime(0.045, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.05);
}
function winSound() {
  if (!sound) return;
  const a = audio(); if (!a) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const t = a.currentTime + i * 0.11, o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.42);
  });
}

/* ================= wheel ================= */
class Wheel {
  constructor(el) {
    this.canvas = el.querySelector('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.pointer = $('#pointer');
    this.items = wheelColors();
    this.rotation = rand() * TAU;
    this.mode = 'idle';           // idle | free | land
    this.v = 0;                   // current speed, rad/ms
    this.vmax = 2.2 * TAU / 1000;
    this.size = 0; this.dpr = 1;
    const ro = () => this.resize();
    if ('ResizeObserver' in window) new ResizeObserver(ro).observe(this.canvas);
    else window.addEventListener('resize', ro);
  }
  resize() {
    const w = this.canvas.getBoundingClientRect().width;
    if (!w) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.size = w;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(w * this.dpr);
    this.draw();
  }
  setItems(items) { this.items = items; this.lastSeg = this.segAt(); this.draw(); }
  draw() {
    if (!this.size) return;
    const ctx = this.ctx, size = this.size, items = this.items;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const c = size / 2, r = c - 6;
    if (!items.length) {
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
      ctx.fillStyle = '#efe6d3'; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
      return;
    }
    const n = items.length, arc = TAU / n;
    for (let i = 0; i < n; i++) {
      const it = items[i], a0 = this.rotation + i * arc, a1 = a0 + arc;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a1); ctx.closePath();
      if (it.gold) {
        const p0 = n > 1 ? [c + Math.cos(a0) * r, c + Math.sin(a0) * r] : [c - r, c - r];
        const p1 = n > 1 ? [c + Math.cos(a1) * r, c + Math.sin(a1) * r] : [c + r, c + r];
        const g = ctx.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
        g.addColorStop(0, '#A9791C'); g.addColorStop(0.38, '#F9E08B'); g.addColorStop(0.58, '#E6C15A'); g.addColorStop(1, '#B8892A');
        ctx.fillStyle = g;
      } else ctx.fillStyle = it.hex;
      ctx.fill();
      if (n > 1) { ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(); }
    }
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  }
  segAt() { const n = this.items.length; return n ? Math.floor(mod(POINTER - this.rotation, TAU) / (TAU / n)) % n : -1; }
  tickCheck() {
    const s = this.segAt();
    if (s !== this.lastSeg) {
      this.lastSeg = s;
      const p = this.pointer; p.classList.remove('flick'); void p.offsetWidth; p.classList.add('flick');
      playTick();
    }
  }
  // phase 1: spin freely while the database picks the colour
  startFree() {
    this.mode = 'free';
    this.lastSeg = this.segAt();
    let t0 = null, prev = null;
    const step = now => {
      if (this.mode !== 'free') return;
      if (t0 === null) { t0 = now; prev = now; }
      const dt = Math.min(50, now - prev); prev = now;
      this.v = this.vmax * Math.min(1, (now - t0) / 500);
      this.rotation += this.v * dt;
      this.draw(); this.tickCheck();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  // phase 2: slow down smoothly and stop exactly on `key`
  landOn(key, items) {
    this.mode = 'land';
    this.setItems(items);
    const n = items.length, arc = TAU / n;
    const idx = Math.max(0, items.findIndex(c => c.key === key));
    const f = 0.15 + rand() * 0.7;                                   // inside the slice, never on a line
    const target = mod(POINTER - (idx + f) * arc, TAU);
    const v = Math.max(this.v, this.vmax * 0.6);
    let D = mod(target - mod(this.rotation, TAU), TAU);
    while (D < v * 4200 / 3 - Math.PI) D += TAU;                     // about 4 s of slowing down
    const T = 3 * D / v;                                             // starts at today's speed — no jerk
    return this.animate(D, T).then(() => items[this.segAt()]);
  }
  // error: just glide to a stop
  coast() {
    this.mode = 'land';
    const v = this.v || 0;
    if (!v) { this.mode = 'idle'; return Promise.resolve(); }
    return this.animate(v * 1200 / 3, 1200);
  }
  animate(D, T) {
    const start = this.rotation;
    return new Promise(resolve => {
      let t0 = null;
      const step = now => {
        if (t0 === null) t0 = now;
        const t = Math.min(1, (now - t0) / T);
        this.rotation = start + D * ease(t);
        this.draw(); this.tickCheck();
        if (t < 1) { requestAnimationFrame(step); return; }
        this.rotation = mod(this.rotation, TAU);
        this.v = 0; this.mode = 'idle';
        this.draw();
        resolve();
      };
      requestAnimationFrame(step);
    });
  }
}

/* ================= elements ================= */
const wheel = new Wheel($('#wheelWrap'));
const nameInput = $('#nameInput'), spinBtn = $('#spinBtn'), picksEl = $('#picks'), lock = $('#lock');
const modal = $('#modal'), closeBtn = $('#closeBtn');
const soundBtn = $('#soundBtn'), fsBtn = $('#fsBtn');
$('#marquee').textContent = T.marquee.repeat(6);

/* ================= rendering ================= */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function setLock(msg) {
  lock.textContent = '';
  if (msg) {
    const box = document.createElement('div');
    const sub = document.createElement('span'); sub.textContent = msg[1];
    box.append(msg[0], sub);
    lock.append(box);
  }
  lock.classList.toggle('hidden', !msg);
}

function renderList() {
  $('#count').textContent = `${picks.length}/${MAX}`;
  const live = $('#live');
  live.textContent = !API ? '⚙️' : !loaded && online ? '⏳' : online ? T.liveOn : T.liveOff;
  live.classList.toggle('off', loaded && !online);
  picksEl.innerHTML = '';
  if (!picks.length) {
    picksEl.innerHTML = `<li class="empty">${T.empty}</li>`;
    return;
  }
  picks.forEach((p, i) => {
    const isMine = mine.some(m => sameName(m, p.name));
    const li = document.createElement('li');
    li.className = 'prow' + (isMine ? ' mine' : '') + (freshName && sameName(freshName, p.name) ? ' fresh' : '');
    const no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1) + '.';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name; nm.title = p.name;
    li.append(no, nm);
    if (isMine) { const me = document.createElement('span'); me.className = 'me'; me.textContent = T.me; li.append(me); }
    const res = document.createElement('span');
    if (p.color) {
      const c = BY_KEY[p.color];
      res.className = 'res'; res.style.background = swatch(c); res.style.color = inkFor(c);
      res.textContent = `${c.name} ${c.emoji}`;
    } else { res.className = 'res none'; res.textContent = '—'; }
    li.append(res);
    picksEl.appendChild(li);
  });
  freshName = null;
}

function renderWheel() {
  const free = wheelColors();
  const full = picks.length >= MAX || !free.length;
  if (!busy) wheel.setItems(free);

  const status = $('#status');
  status.textContent = '';
  if (loaded && !full) {
    const [a, b, c] = T.freeLeft(free.length);
    const strong = document.createElement('b'); strong.textContent = b;
    status.append(a, strong, c);
  } else if (loaded) status.textContent = T.allTaken;

  if (busy) setLock(null);
  else if (!API) setLock(T.lockNoApi);
  else if (!loaded) setLock(online ? T.lockLoading : T.lockOffline);
  else if (full) setLock(T.lockDone(picks.length));
  else setLock(null);

  const canType = !busy && loaded && !full;
  nameInput.disabled = !canType;
  spinBtn.disabled = !canType;
  nameInput.placeholder = loaded && full ? T.placeholderFull : T.placeholder;
  spinBtn.textContent = busy ? T.spinning : T.spin;
}

function render() { renderList(); renderWheel(); }

/* ================= load + live updates ================= */
let inFlight = false;
async function refresh() {
  if (!API || inFlight || busy || !modal.classList.contains('hidden')) return;   // never reshuffle the wheel under an open popup
  inFlight = true;
  try {
    const r = await apiList();
    if (busy) return;                       // a spin started meanwhile — its own answer wins
    if (r.ok) {
      picks = sanitizePicks(r.picks); if (r.max > 0) MAX = r.max;
      loaded = true; online = true;
    } else online = false;
  } catch (e) {
    online = false;
  } finally {
    inFlight = false;
  }
  if (!busy) render();
}
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
window.addEventListener('online', refresh);

/* ================= spin ================= */
async function spin() {
  if (busy || !loaded || !modal.classList.contains('hidden')) return;
  const name = cleanName(nameInput.value);
  if (!name) { toast(T.toastTypeName); nameInput.focus(); return; }
  const already = picks.find(p => sameName(p.name, name));
  if (already && already.color) { showResult(already, true); return; }
  if (already) { toast(T.toastExists); return; }
  if (picks.length >= MAX) { toast(T.toastFull); return; }
  if (!wheelColors().length) { toast(T.toastNoColors); return; }

  audio();
  busy = true;
  nameInput.blur();
  render();
  wheel.startFree();

  let r;
  try { r = await apiSpin(name); } catch (e) { r = { ok: false, error: 'network' }; }
  if (Array.isArray(r.picks)) { picks = sanitizePicks(r.picks); online = true; }
  if (r.max > 0) MAX = r.max;

  if (r.ok && r.pick && BY_KEY[r.pick.color]) {
    const pick = picks.find(p => sameName(p.name, r.pick.name)) || { name: cleanName(r.pick.name), color: r.pick.color };
    await wheel.landOn(pick.color, wheelColors(pick));          // wheel still shows this colour until the popup closes
    rememberMine(pick.name);
    freshName = pick.name;
    nameInput.value = '';
    busy = false;
    renderList();
    renderWheelControlsOnly();
    winSound();
    const c = BY_KEY[pick.color];
    confetti(c.gold ? ['#F9E08B', '#E6C15A', '#B8892A', '#111111', '#FF5FA2'] : [c.hex, c.hex, c.hex, '#111111', '#C8FF4D', '#FF5FA2']);
    showResult(pick, false);
    return;
  }

  await wheel.coast();
  busy = false;
  if (r.error === 'network') online = false;
  render();
  if (r.error === 'exists' && r.pick && BY_KEY[r.pick.color]) showResult(r.pick, true);
  else toast({ exists: T.toastExists, full: T.toastFull, no_colors: T.toastNoColors, no_name: T.toastTypeName, busy: T.toastBusy, network: T.toastNetwork }[r.error] || T.toastServer);
}
function renderWheelControlsOnly() {          // after landing: keep the colour on the wheel, just unlock the form
  const keep = wheel.items;
  renderWheel();
  wheel.setItems(keep);
  setLock(null);
}
$('#spinForm').addEventListener('submit', e => { e.preventDefault(); spin(); });

/* ================= result popup ================= */
function showResult(pick, existed) {
  const c = BY_KEY[pick.color];
  const top = $('#modalTop');
  top.style.background = swatch(c);
  top.style.color = inkFor(c);
  $('#winKicker').textContent = existed ? T.existsKicker(pick.name) : T.winKicker(pick.name);
  $('#winTitle').textContent = `${c.name} ${c.emoji}`;
  $('#winSub').textContent = existed ? T.existsSub : '';
  $('#winSub').classList.toggle('hidden', !existed);
  closeBtn.textContent = existed ? T.closeExists : T.closeWin;
  modal.classList.remove('hidden');
  closeBtn.focus();
}
function closeModal() {
  if (modal.classList.contains('hidden')) return;
  modal.classList.add('hidden');
  render();                                   // the picked colour leaves the wheel now
  refresh();
}
closeBtn.onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

/* ================= copy ================= */
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
}
$('#copyBtn').onclick = async () => {
  if (!picks.length) { toast(T.toastCopyEmpty); return; }
  const lines = picks.map((p, i) => `${i + 1}. ${p.name} — ${p.color ? BY_KEY[p.color].name + ' ' + BY_KEY[p.color].emoji : '-'}`);
  await copy([T.copyHeader, '', ...lines].join('\n'));
  toast(T.toastCopied);
};

/* ================= confetti ================= */
const cf = $('#confetti'), cfx = cf.getContext('2d');
let cfId = 0;
function confetti(colors) {
  const id = ++cfId;
  const d = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cf.width = W * d; cf.height = H * d; cfx.setTransform(d, 0, 0, d, 0, 0);
  const parts = [];
  for (let i = 0; i < 220; i++) {
    const left = i % 2 === 0;
    parts.push({
      x: left ? -10 : W + 10, y: H * 0.85,
      vx: (left ? 1 : -1) * (3 + rand() * W / 90),
      vy: -Math.sqrt(2 * 0.32 * H * (0.45 + rand() * 0.5)),
      w: 7 + rand() * 6, h: 10 + rand() * 8,
      rot: rand() * TAU, vr: (rand() - 0.5) * 0.35,
      flip: rand() * TAU, vf: 0.08 + rand() * 0.15,
      c: colors[Math.floor(rand() * colors.length)]
    });
  }
  const t0 = performance.now();
  (function frame(now) {
    if (id !== cfId) return;
    cfx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy = Math.min(p.vy + 0.32, 4.5);
      p.vx *= 0.985;
      p.x += p.vx + Math.sin(p.flip) * 0.6; p.y += p.vy;
      p.rot += p.vr; p.flip += p.vf;
      if (p.y > H + 30) continue;
      alive++;
      cfx.save();
      cfx.translate(p.x, p.y); cfx.rotate(p.rot); cfx.scale(1, Math.cos(p.flip));
      cfx.fillStyle = p.c; cfx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cfx.restore();
    }
    if (alive && now - t0 < 7000) requestAnimationFrame(frame);
    else cfx.clearRect(0, 0, W, H);
  })(t0);
}

/* ================= misc ================= */
function renderSound() {
  soundBtn.textContent = sound ? '🔊' : '🔇';
  soundBtn.title = sound ? T.soundOn : T.soundOff;
}
soundBtn.onclick = () => {
  sound = !sound; renderSound();
  try { localStorage.setItem(LS_SOUND, sound ? 'on' : 'off'); } catch (e) {}
};
fsBtn.onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => document.body.classList.toggle('presenting'));
  else document.body.classList.toggle('presenting');
};
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', !!document.fullscreenElement);
});
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('hidden') && e.key === 'Escape') { e.preventDefault(); closeModal(); }
});

/* ================= init ================= */
renderSound();
render();
wheel.resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => wheel.draw());
refresh();
})();
</script>
</body>
