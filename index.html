<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rode Warne Tuka Hadioh 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111;--paper:#FFF7E8;--white:#ffffff;
  --lime:#C8FF4D;--pink:#FF5FA2;--purple:#7C5CFF;--yellow:#FFE14D;--sky:#7CC8FF;
  --muted:#6b6357;
  --b:3px solid var(--ink);--sh:5px 5px 0 var(--ink);--sh-sm:3px 3px 0 var(--ink);
  --r:18px;
  --font:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --stage:min(100%,60vh,540px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(#d8c9ad 1.3px,transparent 1.3px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- header + marquee ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px 12px}
.brand{font-weight:800;font-size:clamp(20px,3vw,28px);letter-spacing:-.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sticker{display:inline-block;font-size:13px;font-weight:800;background:var(--lime);border:var(--b);border-radius:999px;padding:3px 10px;transform:rotate(-4deg);box-shadow:var(--sh-sm);letter-spacing:0}
.tools{display:flex;gap:10px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:var(--b);background:var(--white);box-shadow:var(--sh-sm);cursor:pointer;font-size:19px;display:grid;place-items:center;transition:transform .1s,box-shadow .1s}
.icon-btn:active{transform:translate(3px,3px);box-shadow:none}
.marquee{background:var(--ink);color:var(--lime);border-block:var(--b);overflow:hidden;white-space:nowrap;font-weight:800;font-size:15px;letter-spacing:.3px}
.marquee .track{display:inline-block;padding:8px 0;animation:scroll 28s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"wheel names" "settings names";gap:26px 34px;padding:24px 22px 40px;align-items:start}
.wheel-col{grid-area:wheel;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.names-col{grid-area:names;display:flex;flex-direction:column;gap:14px;min-width:0}
.settings-col{grid-area:settings;display:flex;justify-content:center}
.col-title{margin:0;font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-1px;line-height:1}
.col-title .hl{display:inline-block;padding:2px 12px 4px;border:var(--b);border-radius:12px;box-shadow:var(--sh-sm);transform:rotate(-2deg)}
.col-title .hl.pink{background:var(--pink)}
.col-title .hl.sky{background:var(--sky)}
.col-title small{font-size:15px;font-weight:800;margin-left:10px;vertical-align:middle;background:var(--yellow);border:var(--b);padding:2px 10px;border-radius:999px;letter-spacing:0}

.card{background:var(--white);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);padding:16px;width:100%}
.btn{border:var(--b);background:var(--white);padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .1s,box-shadow .1s}
.btn:hover{background:#fffbe9}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lime{background:var(--lime)}
.btn.pink{background:var(--pink)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.label{font-size:14px;font-weight:700;margin:0 0 10px}
.label span{font-weight:500;color:var(--muted)}

/* ---------- turn + spin ---------- */
.turn{font-size:19px;font-weight:600;text-align:center;min-height:30px}
.turn b{font-size:24px;font-weight:800;background:var(--lime);border:var(--b);border-radius:10px;padding:0 10px;margin-left:4px;display:inline-block;transform:rotate(-1.5deg)}
.spin-btn{min-width:250px;font-size:19px;font-weight:800;padding:14px 28px;border-radius:999px;background:var(--pink);box-shadow:var(--sh)}
.spin-btn:active:not(:disabled){transform:translate(5px,5px)}

/* ---------- wheel ---------- */
.wheel-wrap{position:relative;width:var(--stage);aspect-ratio:1/1;margin-top:14px;container-type:inline-size}
.wheel-wrap canvas{display:block;width:100%;height:100%;border-radius:50%;cursor:pointer;filter:drop-shadow(7px 7px 0 var(--ink))}
.pointer{position:absolute;top:-20px;left:50%;width:46px;height:54px;margin-left:-23px;z-index:4;transform-origin:23px 20px;pointer-events:none}
.pointer svg{width:100%;height:100%;display:block;overflow:visible}
.pointer.flick{animation:flick .14s ease-out}
@keyframes flick{0%{transform:rotate(0)}35%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--ink);padding:0;z-index:2;
  background:var(--lime);color:var(--ink);font-weight:800;letter-spacing:.04em;font-size:13px;font-size:clamp(10px,3.4cqi,21px);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
.hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.06) rotate(-4deg)}
.hub:disabled{cursor:not-allowed}
.lock{position:absolute;inset:0;border-radius:50%;z-index:3;display:grid;place-items:center;text-align:center;padding:16%;
  background:rgba(255,247,232,.84);font-weight:800;font-size:clamp(16px,5cqi,28px);line-height:1.25;cursor:default}
.lock span{display:block;font-size:.6em;font-weight:600;color:var(--muted);margin-top:8px}

/* ---------- settings ---------- */
.settings{display:flex;flex-direction:column;gap:18px;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;border:2.5px solid var(--ink);background:var(--white);font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .1s}
.cchip:active{transform:translate(2px,2px);box-shadow:none}
.cchip .dot{width:15px;height:15px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.cchip.off{opacity:.4;border-style:dashed;text-decoration:line-through;box-shadow:none}
.cchip.used{background:#ece5d6;opacity:.6;text-decoration:line-through;box-shadow:none}
.note{margin:0;font-size:14px;font-weight:700;background:var(--yellow);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px}
input[type=range]{width:100%;accent-color:var(--pink)}

/* ---------- names ---------- */
.add-row{display:flex;gap:10px}
.add-row input{flex:1;min-width:0;background:var(--paper);border:var(--b);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:600;outline:none}
.add-row input:focus{background:#fff;box-shadow:var(--sh-sm)}
.names{list-style:none;margin:16px 0 0;display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:2px 6px 6px 2px}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--white);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.nrow .no{font-size:22px;font-weight:800;min-width:36px;text-align:right}
.nrow .nm{flex:1;min-width:0;font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .res{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:5px 12px;border-radius:999px;white-space:nowrap;border:2.5px solid var(--ink)}
.nrow .res.none{border:0;color:var(--muted);font-weight:600;padding:5px 4px}
.nrow .res.wait{background:var(--ink);color:var(--lime);transform:rotate(-2deg)}
.nrow.is-turn{background:var(--lime)}
.nrow.fresh{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.mini{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--ink);background:var(--white);cursor:pointer;font-size:15px;font-weight:800;flex:none}
.mini:hover{background:var(--yellow)}
.mini:disabled{opacity:.35;cursor:not-allowed}
.empty{text-align:center;padding:30px 10px;border:3px dashed var(--ink);border-radius:14px;font-size:16px;font-weight:600;line-height:1.6;background:var(--paper)}
.names-actions{margin-top:16px}

/* ---------- presentation ---------- */
body.presenting{--stage:min(100%,70vh,880px)}
body.presenting .settings-col,body.presenting .add-row,body.presenting .names-actions,body.presenting .mini{display:none}
body.presenting .names{margin-top:0}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(17,17,17,.55);animation:fade .2s}
.modal-card{width:min(100%,480px);background:var(--white);border:var(--b);border-radius:24px;overflow:hidden;box-shadow:9px 9px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.modal-top{padding:44px 24px 48px;text-align:center;border-bottom:var(--b)}
.kicker{margin:0 0 10px;font-size:20px;font-weight:800}
.modal-top h2{margin:0;font-size:clamp(44px,11vw,70px);line-height:1;letter-spacing:-1.5px;font-weight:800}
.modal-actions{display:flex;justify-content:flex-end;padding:18px 20px 20px}
.modal-actions .btn{font-size:16px;padding:11px 18px}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes fade{from{opacity:0}}

#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--lime);font-weight:800;font-size:15px;
  padding:11px 18px;border-radius:999px;border:3px solid var(--lime);opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  :root{--stage:min(100%,64vh)}
  main{grid-template-columns:1fr;grid-template-areas:"wheel" "names" "settings";padding:20px 14px 36px;gap:34px}
  .names{max-height:none}
}
@media (prefers-reduced-motion:reduce){.marquee .track{animation:none}}
</style>
</head>
<body>

<header>
  <div class="brand">🎁 Rode Warne Tuka Hadioh <span class="sticker">ganu kite 🐢</span></div>
  <div class="tools">
    <button class="icon-btn" id="soundBtn" title="Bunyi">🔊</button>
    <button class="icon-btn" id="fsBtn" title="Skrin penoh">⛶</button>
  </div>
</header>
<div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

<main>
  <!-- ========== RODE ========== -->
  <section class="wheel-col">
    <h2 class="col-title"><span class="hl pink">Rode 🎡</span></h2>
    <div class="turn" id="turnLabel"></div>
    <div class="wheel-wrap" id="wheelWrap">
      <div class="pointer">
        <svg viewBox="0 0 46 54" aria-hidden="true">
          <path d="M23 52 L5 15 A20 20 0 0 1 41 15 Z" fill="#111" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="23" cy="18" r="7" fill="#FF5FA2" stroke="#fff" stroke-width="2"/>
        </svg>
      </div>
      <canvas aria-label="Rode warne"></canvas>
      <button class="hub" id="hub">PUSING</button>
      <div class="lock hidden" id="lock"></div>
    </div>
    <button class="btn spin-btn" id="spinBtn">🌀 Pusing</button>
  </section>

  <section class="settings-col">
    <div class="card settings">
      <div>
        <p class="label">Warne kak rode <span>(klik nok on/off)</span></p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="btn-row">
        <button class="btn" id="shuffleColorsBtn" data-lock>🔀 Kocok warne</button>
        <button class="btn" id="allColorsBtn" data-lock>✅ Semue warne</button>
      </div>
      <p class="note">🔒 Warne hok doh kene ambik terus buang dari rode — dok buleh ulang.</p>
      <div>
        <p class="label">Lame pusing: <b id="durLabel">5</b> saat</p>
        <input type="range" id="duration" min="2" max="12" value="5">
      </div>
    </div>
  </section>

  <!-- ========== NAME ========== -->
  <section class="names-col">
    <h2 class="col-title"><span class="hl sky">Name 📝</span><small id="nameCount">0</small></h2>
    <div class="card">
      <div class="add-row">
        <input type="text" id="nameInput" maxlength="40" placeholder="Taip name, tekang Enter…" autocomplete="off" enterkeyhint="done">
        <button class="btn lime" id="addBtn" data-lock>Tamboh</button>
      </div>
      <ol class="names" id="names"></ol>
      <div class="btn-row names-actions" id="namesActions">
        <button class="btn" id="copyBtn">📋 Saling keputusang</button>
        <button class="btn" id="resetBtn" data-lock>↺ Maing semule</button>
        <button class="btn" id="clearBtn" data-lock>🗑️ Kosongkang</button>
      </div>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-card">
    <div class="modal-top" id="modalTop">
      <p class="kicker" id="winKicker"></p>
      <h2 id="winTitle"></h2>
    </div>
    <div class="modal-actions">
      <button class="btn pink" id="closeBtn">OK</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   SEMUA AYAT KAK SINI — senang nok tukor ikut loghat kampung mung 😎
   ===================================================================== */
const T = {
  marquee: '🎁 TUKA HADIOH ✦ pusing je, jangang pikir banyok ✦ warne mung, hadioh mung ✦ no cap 🧢 ✦ slay gok 💅 ✦ ganu kite 🐢 ✦ ',
  turn: '🫵 Gilirang',
  turnNone: 'Belum ade name lagi 🥲',
  turnDone: 'Semue doh siap ✅',
  spin: '🌀 Pusing',
  spinFor: name => `🌀 Pusing la, ${name}!`,
  lockNoNames: ['🔒 Bubuh name dulu weh', 'Taip name, tekang Enter'],
  lockDone: ['🎉 Semue doh dapak warne!', 'Tamboh name lagi ke tekang ↺ Maing semule'],
  lockNoLeft: n => ['😅 Warne doh habih', `Warne ade ${n} je — tekang ↺ Maing semule`],
  lockNoColors: ['🎨 Rode kosong', 'Bubuh sekurang-kurangnye satu warne'],
  emptyList: 'Dok ade name lagi 🥲<br>Taip name kak atah, tekang <b>Enter</b> 👆',
  waiting: '👀 gilirang',
  redoTitle: 'Pusing semule untuk name ning',
  delTitle: 'Buang name ning',
  chipOn: 'Klik nok buang dari rode',
  chipOff: 'Klik nok bubuh balik kak rode',
  chipUsed: name => `Doh kene ambik dengang ${name}`,
  toastTypeName: 'Taip name dulu weh 😤',
  toastDupOne: 'Name tu doh ade lah 🙄',
  toastDupMany: n => `${n} name doh ade, dok tamboh`,
  toastAdded: n => `${n} name doh masuk ✅`,
  toastCopied: 'Doh saling! Paste kak WhatsApp 📲',
  toastNeedName: 'Bubuh name dulu weh',
  toastAllDone: 'Semue doh dapak warne 💅',
  toastNoColor: 'Rode kosong, bubuh warne dulu',
  toastNoLeft: 'Warne doh habih 😅',
  toastTooMany: n => `Warne ade ${n} je — name lebih tu dok dapak warne 😬`,
  confirmReset: 'Kosongkang semue warne & maing semule? (Name kekal)',
  confirmClear: 'Buang semue name ke? 😳',
  winKicker: name => `🎉 ${name} dapak warne`,
  next: name => `Lepah ning: ${name} ➜`,
  finished: 'Siap! Slay 💅',
  copyHeader: '🎁 Tuka Hadioh — Warne Tema',
  soundOn: 'Bunyi: on 🔊',
  soundOff: 'Bunyi: off 🔇'
};

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const POINTER = -Math.PI / 2;            // pointer at the top of the wheel
const STORE = 'rodaWarna.v1';
const FONT = '"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
const INK = '#111111';

const rand = (() => {
  const c = window.crypto;
  if (c && c.getRandomValues) {
    const buf = new Uint32Array(1);
    return () => { c.getRandomValues(buf); return buf[0] / 4294967296; };
  }
  return Math.random;
})();
const randInt = n => Math.floor(rand() * n);
const mod = (a, m) => ((a % m) + m) % m;
const ease = t => 1 - Math.pow(1 - t, 3);

/* ================= colours: 11 warna Tema Tukar Hadiah ================= */
const COLORS = [
  { key: 'red',    name: 'Merah',  emoji: '❤️', hex: '#FF4245' },
  { key: 'pink',   name: 'Pink',   emoji: '💗', hex: '#FF6FB5' },
  { key: 'blue',   name: 'Blue',   emoji: '💙', hex: '#0091FF' },
  { key: 'purple', name: 'Ungu',   emoji: '💜', hex: '#AF52DE' },
  { key: 'green',  name: 'Hijau',  emoji: '💚', hex: '#30D158' },
  { key: 'yellow', name: 'Kuning', emoji: '💛', hex: '#FFD600' },
  { key: 'orange', name: 'Oren',   emoji: '🧡', hex: '#FF9230' },
  { key: 'white',  name: 'Putih',  emoji: '🤍', hex: '#F5F5F7' },
  { key: 'black',  name: 'Hitam',  emoji: '🖤', hex: '#1C1C1E' },
  { key: 'brown',  name: 'Coklat', emoji: '🤎', hex: '#8B5E3C' },
  { key: 'gold',   name: 'Gold',   emoji: '✨', hex: '#D4AF37', gold: true }
];
const BY_KEY = Object.fromEntries(COLORS.map(c => [c.key, c]));
const GOLD_CSS = 'linear-gradient(135deg,#A9791C 0%,#F9E08B 38%,#E6C15A 58%,#B8892A 100%)';
const SIMILAR = new Set(['red|pink','red|orange','orange|yellow','yellow|gold','orange|gold','brown|gold','brown|orange','pink|purple','black|brown']);
const alike = (a, b) => SIMILAR.has(a + '|' + b) || SIMILAR.has(b + '|' + a);

function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function inkFor(c) {
  if (c.gold) return '#2b1d00';
  const [r, g, b] = hexToRgb(c.hex);
  return (r * 299 + g * 587 + b * 114) / 1000 >= 150 ? INK : '#ffffff';
}
const swatch = c => c.gold ? GOLD_CSS : c.hex;

function shuffledOrder() {
  let best = null;
  for (let tries = 0; tries < 400; tries++) {
    const a = COLORS.map(c => c.key);
    for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    let bad = 0;
    for (let i = 0; i < a.length; i++) if (alike(a[i], a[(i + 1) % a.length])) bad++;
    if (!best || bad < best.bad) best = { a, bad };
    if (!bad) break;
  }
  return best.a;
}

/* ================= state ================= */
const state = {
  names: [],                                      // [{ name, color: key|null }]
  order: shuffledOrder(),
  enabled: Object.fromEntries(COLORS.map(c => [c.key, true])),
  duration: 5,
  sound: true
};
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!d) return;
    if (Array.isArray(d.names)) state.names = d.names
      .filter(x => x && typeof x.name === 'string' && x.name.trim())
      .map(x => ({ name: x.name.trim().slice(0, 40), color: BY_KEY[x.color] ? x.color : null }));
    const seen = new Set();
    for (const n of state.names) {                 // older saves could repeat a colour — keep the first only
      if (!n.color) continue;
      if (seen.has(n.color)) n.color = null; else seen.add(n.color);
    }
    if (Array.isArray(d.order) && d.order.length === COLORS.length && d.order.every(k => BY_KEY[k])) state.order = d.order;
    if (d.enabled) for (const c of COLORS) if (typeof d.enabled[c.key] === 'boolean') state.enabled[c.key] = d.enabled[c.key];
    if (d.duration >= 2 && d.duration <= 12) state.duration = +d.duration;
    if (typeof d.sound === 'boolean') state.sound = d.sound;
  } catch (e) {}
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
load();

const enabledCount = () => COLORS.filter(c => state.enabled[c.key]).length;
const usedKeys = () => new Set(state.names.map(n => n.color).filter(Boolean));
const turnIndex = () => state.names.findIndex(n => !n.color);
function wheelItems() {                           // picked colours never come back until freed
  const used = usedKeys();
  return state.order.filter(k => state.enabled[k] && !used.has(k)).map(k => BY_KEY[k]);
}

/* ================= sound ================= */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function playTick() {
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(1300, t);
  o.frequency.exponentialRampToValueAtTime(520, t + 0.03);
  g.gain.setValueAtTime(0.045, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.05);
}
function winSound() {
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const t = a.currentTime + i * 0.11, o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.42);
  });
}

/* ================= wheel ================= */
class Wheel {
  constructor(el) {
    this.canvas = el.querySelector('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.pointer = el.querySelector('.pointer');
    this.rotation = rand() * TAU;
    this.size = 0; this.dpr = 1;
    const ro = () => this.resize();
    if ('ResizeObserver' in window) new ResizeObserver(ro).observe(this.canvas);
    else window.addEventListener('resize', ro);
  }
  resize() {
    const w = this.canvas.getBoundingClientRect().width;
    if (!w) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.size = w;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(w * this.dpr);
    this.draw();
  }
  draw() {
    if (!this.size) return;
    const ctx = this.ctx, size = this.size;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const c = size / 2, r = c - 6;
    const items = wheelItems();
    if (!items.length) {
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
      ctx.fillStyle = '#efe6d3'; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
      return;
    }
    const n = items.length, arc = TAU / n;
    for (let i = 0; i < n; i++) {
      const it = items[i], a0 = this.rotation + i * arc, a1 = a0 + arc;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a1); ctx.closePath();
      if (it.gold) {
        const p0 = n > 1 ? [c + Math.cos(a0) * r, c + Math.sin(a0) * r] : [c - r, c - r];
        const p1 = n > 1 ? [c + Math.cos(a1) * r, c + Math.sin(a1) * r] : [c + r, c + r];
        const g = ctx.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
        g.addColorStop(0, '#A9791C'); g.addColorStop(0.38, '#F9E08B'); g.addColorStop(0.58, '#E6C15A'); g.addColorStop(1, '#B8892A');
        ctx.fillStyle = g;
      } else ctx.fillStyle = it.hex;
      ctx.fill();
      if (n > 1) { ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(); }
    }
    // no text on the wheel — colours only
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
    ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  }
  segAt(n) { return Math.floor(mod(POINTER - this.rotation, TAU) / (TAU / n)) % n; }
  flick() { const p = this.pointer; p.classList.remove('flick'); void p.offsetWidth; p.classList.add('flick'); }
  spin(ms) {
    return new Promise(resolve => {
      const items = wheelItems(), n = items.length;
      if (!n) return resolve(null);
      const arc = TAU / n;
      const idx = randInt(n);                                   // fair pick, decided up-front
      const f = 0.12 + rand() * 0.76;                           // stop inside the slice, not on a line
      const target = mod(POINTER - (idx + f) * arc, TAU);
      const turns = Math.max(3, Math.round(ms / 1000 * 1.1)) + randInt(2);
      const delta = mod(target - mod(this.rotation, TAU), TAU) + turns * TAU;
      const start = this.rotation;
      let t0 = null, last = this.segAt(n);
      const step = now => {
        if (t0 === null) t0 = now;
        const t = Math.min(1, (now - t0) / ms);
        this.rotation = start + delta * ease(t);
        this.draw();
        const s = this.segAt(n);
        if (s !== last) { last = s; this.flick(); playTick(); }
        if (t < 1) { requestAnimationFrame(step); return; }
        this.rotation = mod(this.rotation, TAU);
        this.draw();
        resolve(items[this.segAt(n)]);
      };
      requestAnimationFrame(step);
    });
  }
}

/* ================= elements ================= */
const wheel = new Wheel($('#wheelWrap'));
const nameInput = $('#nameInput'), namesEl = $('#names');
const spinBtn = $('#spinBtn'), hub = $('#hub'), lock = $('#lock');
const modal = $('#modal'), closeBtn = $('#closeBtn');
const soundBtn = $('#soundBtn'), fsBtn = $('#fsBtn');

let busy = false;
let freshIdx = -1;

$('#marquee').textContent = T.marquee.repeat(6);

/* ================= rendering ================= */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast(msg);
}

function renderChips() {
  const el = $('#chips'); el.innerHTML = '';
  const used = usedKeys();
  for (const k of state.order) {
    const c = BY_KEY[k];
    const b = document.createElement('button');
    b.className = 'cchip' + (state.enabled[k] ? '' : ' off') + (used.has(k) ? ' used' : '');
    b.dataset.lock = '';
    b.title = used.has(k) ? T.chipUsed(state.names.find(n => n.color === k).name) : state.enabled[k] ? T.chipOn : T.chipOff;
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = swatch(c);
    b.append(dot, `${c.name} ${c.emoji}`);
    b.onclick = () => {
      if (busy) return;
      state.enabled[k] = !state.enabled[k];
      save(); renderChips(); wheel.draw(); updateTurn();
    };
    el.appendChild(b);
  }
  if (busy) el.querySelectorAll('button').forEach(b => { b.disabled = true; });
}

function renderNames() {
  namesEl.innerHTML = '';
  $('#nameCount').textContent = state.names.length;
  $('#namesActions').classList.toggle('hidden', !state.names.length);
  if (!state.names.length) {
    namesEl.innerHTML = `<li class="empty">${T.emptyList}</li>`;
    return;
  }
  const ti = turnIndex();
  state.names.forEach((n, i) => {
    const li = document.createElement('li');
    li.className = 'nrow' + (i === ti ? ' is-turn' : '') + (i === freshIdx ? ' fresh' : '');
    const no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1) + '.';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n.name; nm.title = n.name;
    const res = document.createElement('span');
    if (n.color) {
      const c = BY_KEY[n.color];
      res.className = 'res';
      res.style.background = swatch(c);
      res.style.color = inkFor(c);
      res.textContent = `${c.name} ${c.emoji}`;
    } else if (i === ti) { res.className = 'res wait'; res.textContent = T.waiting; }
    else { res.className = 'res none'; res.textContent = '—'; }
    li.append(no, nm, res);
    if (n.color) {
      const redo = document.createElement('button');
      redo.className = 'mini'; redo.textContent = '↺'; redo.title = T.redoTitle;
      redo.disabled = busy;
      redo.onclick = () => { if (busy) return; n.color = null; save(); renderAll(); };
      li.append(redo);
    }
    const del = document.createElement('button');
    del.className = 'mini'; del.textContent = '×'; del.title = T.delTitle;
    del.disabled = busy;
    del.onclick = () => { if (busy) return; state.names.splice(i, 1); save(); renderAll(); };
    li.append(del);
    namesEl.appendChild(li);
  });
  freshIdx = -1;
  const t = namesEl.querySelector('.is-turn');
  if (t && namesEl.scrollHeight > namesEl.clientHeight + 2) {   // scroll inside the list only — never jump the page
    const lr = namesEl.getBoundingClientRect(), tr = t.getBoundingClientRect();
    if (tr.top < lr.top) namesEl.scrollTop += tr.top - lr.top - 6;
    else if (tr.bottom > lr.bottom) namesEl.scrollTop += tr.bottom - lr.bottom + 6;
  }
}

function updateTurn() {
  const ti = turnIndex(), items = wheelItems();
  let msg = null;
  if (!state.names.length) msg = T.lockNoNames;
  else if (ti < 0) msg = T.lockDone;
  else if (!items.length) msg = COLORS.some(c => state.enabled[c.key]) ? T.lockNoLeft(enabledCount()) : T.lockNoColors;
  lock.textContent = '';
  if (msg) {
    const box = document.createElement('div');
    const sub = document.createElement('span'); sub.textContent = msg[1];
    box.append(msg[0], sub);
    lock.append(box);
  }
  lock.classList.toggle('hidden', !msg);
  hub.style.visibility = msg ? 'hidden' : '';

  const can = !msg && !busy;
  spinBtn.disabled = !can; hub.disabled = !can;
  const label = $('#turnLabel');
  label.textContent = '';
  if (ti >= 0) {
    const b = document.createElement('b'); b.textContent = state.names[ti].name;
    label.append(T.turn + ' ', b);
    spinBtn.textContent = T.spinFor(state.names[ti].name);
  } else {
    label.textContent = state.names.length ? T.turnDone : T.turnNone;
    spinBtn.textContent = T.spin;
  }
}

function renderAll() { renderNames(); renderChips(); wheel.draw(); updateTurn(); }

function setBusy(b) {
  busy = b;
  document.querySelectorAll('[data-lock]').forEach(el => { el.disabled = b; });
  nameInput.disabled = b;
  namesEl.querySelectorAll('.mini').forEach(el => { el.disabled = b; });
  updateTurn();
}

/* ================= names ================= */
function addNames(list) {
  let added = 0, dup = 0;
  for (const raw of list) {
    const name = raw.trim().slice(0, 40);
    if (!name) continue;
    if (state.names.some(n => n.name.toLowerCase() === name.toLowerCase())) { dup++; continue; }
    state.names.push({ name, color: null });
    freshIdx = state.names.length - 1;
    added++;
  }
  if (dup) toast(dup === 1 ? T.toastDupOne : T.toastDupMany(dup));
  if (added) {
    save(); renderAll();
    if (state.names.length > enabledCount()) toast(T.toastTooMany(enabledCount()));
  }
  return added;
}
function addFromInput() {
  if (busy) return;
  const v = nameInput.value;
  if (!v.trim()) { toast(T.toastTypeName); nameInput.focus(); return; }
  addNames([v]);
  nameInput.value = '';
  nameInput.focus();
}
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addFromInput(); }
});
nameInput.addEventListener('paste', e => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (/[\r\n\t]/.test(text)) {                       // pasted a column from Excel / a list
    e.preventDefault();
    const n = addNames(text.split(/[\r\n\t]+/));
    if (n && state.names.length <= enabledCount()) toast(T.toastAdded(n));   // keep the 'too many names' warning visible
  }
});
$('#addBtn').onclick = addFromInput;

$('#copyBtn').onclick = () => {
  const lines = state.names.map((n, i) => `${i + 1}. ${n.name} — ${n.color ? BY_KEY[n.color].name + ' ' + BY_KEY[n.color].emoji : '-'}`);
  copy([T.copyHeader, '', ...lines].join('\n'), T.toastCopied);
};
$('#resetBtn').onclick = () => {
  if (!state.names.some(n => n.color)) return;
  if (!confirm(T.confirmReset)) return;
  state.names.forEach(n => { n.color = null; });
  save(); renderAll();
};
$('#clearBtn').onclick = () => {
  if (!confirm(T.confirmClear)) return;
  state.names = [];
  save(); renderAll(); nameInput.focus();
};

/* ================= colour settings ================= */
$('#shuffleColorsBtn').onclick = () => { state.order = shuffledOrder(); save(); renderChips(); wheel.draw(); };
$('#allColorsBtn').onclick = () => { COLORS.forEach(c => { state.enabled[c.key] = true; }); save(); renderChips(); wheel.draw(); updateTurn(); };
const durInput = $('#duration');
durInput.oninput = () => { state.duration = +durInput.value; $('#durLabel').textContent = state.duration; save(); };

/* ================= spin ================= */
function spin() {
  if (busy || !modal.classList.contains('hidden')) return;
  const ti = turnIndex();
  if (!state.names.length) { toast(T.toastNeedName); nameInput.focus(); return; }
  if (ti < 0) { toast(T.toastAllDone); return; }
  if (!wheelItems().length) { toast(COLORS.some(c => state.enabled[c.key]) ? T.toastNoLeft : T.toastNoColor); return; }
  audio();
  setBusy(true);
  wheel.spin(state.duration * 1000).then(c => {
    state.names[ti].color = c.key;
    freshIdx = ti;
    save();
    setBusy(false);
    renderNames(); renderChips(); updateTurn();
    winSound();
    confetti(c.gold ? ['#F9E08B', '#E6C15A', '#B8892A', '#111111', '#FF5FA2'] : [c.hex, c.hex, c.hex, '#111111', '#C8FF4D', '#FF5FA2']);
    showModal(state.names[ti].name, c);
  });
}
spinBtn.onclick = spin;
hub.onclick = spin;
$('#wheelWrap canvas').addEventListener('click', spin);

/* ================= modal ================= */
function showModal(name, c) {
  const top = $('#modalTop');
  top.style.background = swatch(c);
  top.style.color = inkFor(c);
  $('#winKicker').textContent = T.winKicker(name);
  $('#winTitle').textContent = `${c.name} ${c.emoji}`;
  const next = turnIndex();
  closeBtn.textContent = next >= 0 ? T.next(state.names[next].name) : T.finished;
  modal.classList.remove('hidden');
  closeBtn.focus();
}
function closeModal() {
  modal.classList.add('hidden');
  wheel.draw();                      // the picked colour leaves the wheel now
  updateTurn();
}
closeBtn.onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

/* ================= confetti ================= */
const cf = $('#confetti'), cfx = cf.getContext('2d');
let cfId = 0;
function confetti(colors) {
  const id = ++cfId;
  const d = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cf.width = W * d; cf.height = H * d; cfx.setTransform(d, 0, 0, d, 0, 0);
  const parts = [];
  for (let i = 0; i < 220; i++) {
    const left = i % 2 === 0;
    parts.push({
      x: left ? -10 : W + 10, y: H * 0.85,
      vx: (left ? 1 : -1) * (3 + rand() * W / 90),
      vy: -Math.sqrt(2 * 0.32 * H * (0.45 + rand() * 0.5)),
      w: 7 + rand() * 6, h: 10 + rand() * 8,
      rot: rand() * TAU, vr: (rand() - 0.5) * 0.35,
      flip: rand() * TAU, vf: 0.08 + rand() * 0.15,
      c: colors[randInt(colors.length)]
    });
  }
  const t0 = performance.now();
  (function frame(now) {
    if (id !== cfId) return;
    cfx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy = Math.min(p.vy + 0.32, 4.5);
      p.vx *= 0.985;
      p.x += p.vx + Math.sin(p.flip) * 0.6; p.y += p.vy;
      p.rot += p.vr; p.flip += p.vf;
      if (p.y > H + 30) continue;
      alive++;
      cfx.save();
      cfx.translate(p.x, p.y); cfx.rotate(p.rot); cfx.scale(1, Math.cos(p.flip));
      cfx.fillStyle = p.c; cfx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cfx.restore();
    }
    if (alive && now - t0 < 7000) requestAnimationFrame(frame);
    else cfx.clearRect(0, 0, W, H);
  })(t0);
}

/* ================= misc ================= */
function renderSound() {
  soundBtn.textContent = state.sound ? '🔊' : '🔇';
  soundBtn.title = state.sound ? T.soundOn : T.soundOff;
}
soundBtn.onclick = () => { state.sound = !state.sound; renderSound(); save(); };

fsBtn.onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => document.body.classList.toggle('presenting'));
  else document.body.classList.toggle('presenting');
};
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', !!document.fullscreenElement);
});

document.addEventListener('keydown', e => {
  if (!modal.classList.contains('hidden')) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    return;
  }
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT') return;                     // typing a name: Enter only adds it
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); spin(); return; }
  if (e.code === 'Space' && !/^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(tag)) { e.preventDefault(); spin(); }
});

/* ================= init ================= */
durInput.value = state.duration; $('#durLabel').textContent = state.duration;
renderSound();
renderAll();
wheel.resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => wheel.draw());   // redraw once the web font arrives
})();
</script>
</body>
