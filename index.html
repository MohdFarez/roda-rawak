<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roda Warna — Siapa Dapat Warna Apa?</title>
<style>
:root{
  --bg:#0b1020;--card:#141a2e;--card2:#1b2340;--line:#28315a;--text:#eef1fa;--muted:#8d97bd;
  --accent:#0091FF;--r:18px;
  --gold:linear-gradient(135deg,#A9791C 0%,#F9E08B 38%,#E6C15A 58%,#B8892A 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --stage:min(100%,62vh,560px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:var(--font);color:var(--text);
  background:radial-gradient(1100px 700px at 25% 15%,#1b2a5c 0%,rgba(11,16,32,0) 60%),
             radial-gradient(900px 600px at 95% 95%,#2b1742 0%,rgba(11,16,32,0) 55%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.2px}
.tools{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center}
.icon-btn:hover{background:var(--card2)}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"wheel names" "settings names";gap:24px 30px;padding:4px 22px 30px;align-items:start}
.wheel-col{grid-area:wheel}.names-col{grid-area:names}.settings-col{grid-area:settings;display:flex;justify-content:center}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col.wheel-col{align-items:center}
.col-title{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
.col-title small{font-size:14px;font-weight:700;color:var(--muted);margin-left:8px;vertical-align:middle;
  background:var(--card2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;letter-spacing:0}
.card{background:rgba(20,26,46,.86);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px);width:100%}
.btn{border:1px solid var(--line);background:var(--card2);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#3d4a82;background:#222b4d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border:0;color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.label{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}

/* turn banner + spin */
.turn{font-size:18px;color:var(--muted);text-align:center;min-height:28px}
.turn b{color:var(--text);font-size:22px}
.spin-btn{min-width:240px;font-size:17px;padding:13px 26px;border-radius:999px;box-shadow:0 10px 28px rgba(0,145,255,.35)}

/* wheel */
.wheel-wrap{position:relative;width:var(--stage);aspect-ratio:1/1;margin-top:12px;container-type:inline-size}
.wheel-wrap canvas{display:block;width:100%;height:100%;border-radius:50%;cursor:pointer;filter:drop-shadow(0 22px 40px rgba(0,0,0,.5))}
.pointer{position:absolute;top:-18px;left:50%;width:44px;height:52px;margin-left:-22px;z-index:4;transform-origin:22px 20px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));pointer-events:none}
.pointer svg{width:100%;height:100%;display:block}
.pointer.flick{animation:flick .14s ease-out}
@keyframes flick{0%{transform:rotate(0)}35%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:5px solid #fff;padding:0;z-index:2;
  background:radial-gradient(circle at 35% 30%,#33407a,#0e1430 75%);color:#fff;font-weight:800;letter-spacing:.08em;
  font-size:13px;font-size:clamp(9px,3.1cqi,20px);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .15s}
.hub:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.06)}
.hub:disabled{cursor:not-allowed}
.lock{position:absolute;inset:0;border-radius:50%;z-index:3;display:grid;place-items:center;text-align:center;padding:18%;
  background:rgba(8,12,26,.62);backdrop-filter:blur(2px);font-weight:800;font-size:clamp(15px,4.6cqi,26px);line-height:1.3;cursor:default}
.lock span{display:block;font-size:.62em;font-weight:600;color:var(--muted);margin-top:6px}

/* colour chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.cchip .dot{width:14px;height:14px;border-radius:50%;flex:none}
.cchip.off{opacity:.38;text-decoration:line-through}
.cchip.used{outline:2px dashed rgba(255,255,255,.25);outline-offset:1px}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.settings{display:flex;flex-direction:column;gap:16px;max-width:560px}

/* names */
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;background:#0d1328;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.add-row input:focus{border-color:var(--accent)}
.names{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card2);border:2px solid transparent;transition:.2s}
.nrow .no{font-size:20px;font-weight:800;color:var(--muted);min-width:34px;text-align:right}
.nrow .nm{flex:1;min-width:0;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .res{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.nrow .res.none{color:var(--muted);font-weight:500;padding:6px 4px}
.nrow .res.wait{color:var(--accent);background:rgba(0,145,255,.12)}
.nrow.is-turn{border-color:var(--accent);background:rgba(0,145,255,.10)}
.nrow.fresh{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.mini{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:15px;flex:none}
.mini:hover{color:var(--text);background:#222b4d}
.mini:disabled{opacity:.35;cursor:not-allowed}
.empty{color:var(--muted);text-align:center;padding:28px 10px;border:2px dashed var(--line);border-radius:14px;font-size:15px;line-height:1.6}
.names-actions{margin-top:14px}

/* presentation mode */
body.presenting{--stage:min(100%,74vh,900px)}
body.presenting .settings-col,body.presenting .add-card,body.presenting .names-actions,body.presenting .mini{display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(5,8,20,.72);backdrop-filter:blur(5px);animation:fade .2s}
.modal-card{width:min(100%,480px);background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.modal-top{padding:46px 24px 50px;text-align:center}
.kicker{margin:0 0 10px;font-size:19px;font-weight:700;opacity:.92}
.modal-top h2{margin:0;font-size:clamp(40px,10vw,64px);line-height:1.05;letter-spacing:-1px}
.sub{margin:12px 0 0;font-size:15px;font-weight:600;opacity:.8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px 20px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}}

#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;font-weight:600;font-size:14px;
  padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  :root{--stage:min(100%,66vh)}
  main{grid-template-columns:1fr;grid-template-areas:"wheel" "names" "settings";padding:4px 14px 28px;gap:30px}
  .col-title{font-size:26px}
  .names{max-height:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">🎡 Roda Warna</div>
  <div class="tools">
    <button class="icon-btn" id="soundBtn" title="Bunyi">🔊</button>
    <button class="icon-btn" id="fsBtn" title="Skrin penuh / mod persembahan">⛶</button>
  </div>
</header>

<main>
  <!-- ========== RODA ========== -->
  <section class="col wheel-col">
    <h2 class="col-title">Roda</h2>
    <div class="turn" id="turnLabel"></div>
    <div class="wheel-wrap" id="wheelWrap">
      <div class="pointer">
        <svg viewBox="0 0 44 52" aria-hidden="true">
          <path d="M22 50 L4 14 A20 20 0 0 1 40 14 Z" fill="#ffffff"/>
          <circle cx="22" cy="17" r="6" fill="#0091FF"/>
        </svg>
      </div>
      <canvas aria-label="Roda warna"></canvas>
      <button class="hub" id="hub">PUSING</button>
      <div class="lock hidden" id="lock"></div>
    </div>
    <button class="btn primary spin-btn" id="spinBtn">🎡 Pusing</button>
  </section>

  <section class="settings-col">
    <div class="card settings">
      <div>
        <p class="label">Warna dalam roda <span style="font-weight:400">(klik untuk on/off)</span></p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="btn-row">
        <button class="btn" id="shuffleColorsBtn" data-lock>🔀 Kocok susunan warna</button>
        <button class="btn" id="allColorsBtn" data-lock>✅ Semua warna</button>
      </div>
      <label class="switch"><input type="checkbox" id="uniqueChk" data-lock> Satu warna untuk satu orang sahaja (warna yang dah diambil dibuang dari roda)</label>
      <div>
        <p class="label">Tempoh pusingan: <b id="durLabel">5</b> saat</p>
        <input type="range" id="duration" min="2" max="12" value="5">
      </div>
    </div>
  </section>

  <!-- ========== NAMA ========== -->
  <section class="col names-col">
    <h2 class="col-title">Nama <small id="nameCount">0</small></h2>
    <div class="card add-card">
      <div class="add-row">
        <input type="text" id="nameInput" maxlength="40" placeholder="Taip nama, tekan Enter…" autocomplete="off" enterkeyhint="done">
        <button class="btn primary" id="addBtn" data-lock>Tambah</button>
      </div>
      <ol class="names" id="names"></ol>
      <div class="btn-row names-actions" id="namesActions">
        <button class="btn" id="copyBtn">📋 Salin keputusan</button>
        <button class="btn" id="resetBtn" data-lock>↺ Main semula</button>
        <button class="btn" id="clearBtn" data-lock>🗑️ Kosongkan</button>
      </div>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal-card">
    <div class="modal-top" id="modalTop">
      <p class="kicker" id="winKicker"></p>
      <h2 id="winTitle"></h2>
      <p class="sub" id="winSub"></p>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="closeBtn">OK</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const POINTER = -Math.PI / 2;            // pointer at the top of the wheel
const STORE = 'rodaWarna.v1';
const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif';

const rand = (() => {
  const c = window.crypto;
  if (c && c.getRandomValues) {
    const buf = new Uint32Array(1);
    return () => { c.getRandomValues(buf); return buf[0] / 4294967296; };
  }
  return Math.random;
})();
const randInt = n => Math.floor(rand() * n);
const mod = (a, m) => ((a % m) + m) % m;
const ease = t => 1 - Math.pow(1 - t, 3);

/* ================= colours: iPhone system colours (Apple HIG, dark appearance) + Emas ================= */
const COLORS = [
  { key: 'red',    name: 'Merah',       hex: '#FF4245' },
  { key: 'orange', name: 'Oren',        hex: '#FF9230' },
  { key: 'yellow', name: 'Kuning',      hex: '#FFD600' },
  { key: 'green',  name: 'Hijau',       hex: '#30D158' },
  { key: 'mint',   name: 'Pudina',      hex: '#00DAC3' },
  { key: 'teal',   name: 'Firus',       hex: '#00D2E0' },
  { key: 'cyan',   name: 'Biru Langit', hex: '#3CD3FE' },
  { key: 'blue',   name: 'Biru',        hex: '#0091FF' },
  { key: 'indigo', name: 'Nila',        hex: '#6D7CFF' },
  { key: 'purple', name: 'Ungu',        hex: '#DB34F2' },
  { key: 'pink',   name: 'Merah Jambu', hex: '#FF375F' },
  { key: 'gold',   name: 'Emas',        hex: '#D4AF37', gold: true }
];
const BY_KEY = Object.fromEntries(COLORS.map(c => [c.key, c]));
const GOLD_CSS = 'linear-gradient(135deg,#A9791C 0%,#F9E08B 38%,#E6C15A 58%,#B8892A 100%)';
// pairs that look too alike to sit next to each other on the wheel
const SIMILAR = new Set(['mint|teal','teal|cyan','mint|cyan','red|pink','blue|cyan','blue|indigo','yellow|gold','orange|gold','indigo|purple']);
const alike = (a, b) => SIMILAR.has(a + '|' + b) || SIMILAR.has(b + '|' + a);

function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function inkFor(c) {
  if (c.gold) return '#3b2a05';
  const [r, g, b] = hexToRgb(c.hex);
  return (r * 299 + g * 587 + b * 114) / 1000 >= 150 ? '#14161f' : '#ffffff';
}
const swatch = c => c.gold ? GOLD_CSS : c.hex;

function shuffledOrder() {
  let best = null;
  for (let tries = 0; tries < 400; tries++) {
    const a = COLORS.map(c => c.key);
    for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    let bad = 0;
    for (let i = 0; i < a.length; i++) if (alike(a[i], a[(i + 1) % a.length])) bad++;
    if (!best || bad < best.bad) best = { a, bad };
    if (!bad) break;
  }
  return best.a;
}

/* ================= state ================= */
const state = {
  names: [],                                      // [{ name, color: key|null }]
  order: shuffledOrder(),
  enabled: Object.fromEntries(COLORS.map(c => [c.key, true])),
  unique: false,
  duration: 5,
  sound: true
};
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!d) return;
    if (Array.isArray(d.names)) state.names = d.names
      .filter(x => x && typeof x.name === 'string' && x.name.trim())
      .map(x => ({ name: x.name.trim().slice(0, 40), color: BY_KEY[x.color] ? x.color : null }));
    if (Array.isArray(d.order) && d.order.length === COLORS.length && d.order.every(k => BY_KEY[k])) state.order = d.order;
    if (d.enabled) for (const c of COLORS) if (typeof d.enabled[c.key] === 'boolean') state.enabled[c.key] = d.enabled[c.key];
    if (typeof d.unique === 'boolean') state.unique = d.unique;
    if (d.duration >= 2 && d.duration <= 12) state.duration = +d.duration;
    if (typeof d.sound === 'boolean') state.sound = d.sound;
  } catch (e) {}
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
load();

const usedKeys = () => new Set(state.names.map(n => n.color).filter(Boolean));
const turnIndex = () => state.names.findIndex(n => !n.color);
function wheelItems() {
  const used = state.unique ? usedKeys() : new Set();
  return state.order.filter(k => state.enabled[k] && !used.has(k)).map(k => BY_KEY[k]);
}

/* ================= sound ================= */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function playTick() {
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(1300, t);
  o.frequency.exponentialRampToValueAtTime(520, t + 0.03);
  g.gain.setValueAtTime(0.045, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.05);
}
function winSound() {
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const t = a.currentTime + i * 0.11, o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.42);
  });
}

/* ================= wheel ================= */
class Wheel {
  constructor(el) {
    this.canvas = el.querySelector('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.pointer = el.querySelector('.pointer');
    this.rotation = rand() * TAU;
    this.size = 0; this.dpr = 1;
    const ro = () => this.resize();
    if ('ResizeObserver' in window) new ResizeObserver(ro).observe(this.canvas);
    else window.addEventListener('resize', ro);
  }
  resize() {
    const w = this.canvas.getBoundingClientRect().width;
    if (!w) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.size = w;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(w * this.dpr);
    this.draw();
  }
  draw() {
    if (!this.size) return;
    const ctx = this.ctx, size = this.size;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const c = size / 2, r = c - 5;
    const items = wheelItems();
    if (!items.length) {
      ctx.beginPath(); ctx.arc(c, c, r, 0, TAU);
      ctx.fillStyle = '#1f2747'; ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
      return;
    }
    const n = items.length, arc = TAU / n;
    for (let i = 0; i < n; i++) {
      const it = items[i], a0 = this.rotation + i * arc, a1 = a0 + arc;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a1); ctx.closePath();
      if (it.gold) {
        const p0 = n > 1 ? [c + Math.cos(a0) * r, c + Math.sin(a0) * r] : [c - r, c - r];
        const p1 = n > 1 ? [c + Math.cos(a1) * r, c + Math.sin(a1) * r] : [c + r, c + r];
        const g = ctx.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
        g.addColorStop(0, '#A9791C'); g.addColorStop(0.38, '#F9E08B'); g.addColorStop(0.58, '#E6C15A'); g.addColorStop(1, '#B8892A');
        ctx.fillStyle = g;
      } else ctx.fillStyle = it.hex;
      ctx.fill();
      if (n > 1) { ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke(); }
    }
    const fs = Math.min(r * 0.085, r * 0.75 * arc * 0.55);
    if (fs >= 7) {
      ctx.font = `700 ${fs}px ${FONT}`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        ctx.save();
        ctx.translate(c, c);
        ctx.rotate(this.rotation + (i + 0.5) * arc);
        ctx.fillStyle = inkFor(items[i]);
        ctx.fillText(items[i].name, r - fs * 0.8, 0);
        ctx.restore();
      }
    }
    const g = ctx.createRadialGradient(c, c, r * 0.25, c, c, r);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.86, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
    ctx.beginPath(); ctx.arc(c, c, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  segAt(n) { return Math.floor(mod(POINTER - this.rotation, TAU) / (TAU / n)) % n; }
  flick() { const p = this.pointer; p.classList.remove('flick'); void p.offsetWidth; p.classList.add('flick'); }
  spin(ms) {
    return new Promise(resolve => {
      const items = wheelItems(), n = items.length;
      if (!n) return resolve(null);
      const arc = TAU / n;
      const idx = randInt(n);                                   // fair pick, decided up-front
      const f = 0.12 + rand() * 0.76;                           // stop inside the slice, not on a line
      const target = mod(POINTER - (idx + f) * arc, TAU);
      const turns = Math.max(3, Math.round(ms / 1000 * 1.1)) + randInt(2);
      const delta = mod(target - mod(this.rotation, TAU), TAU) + turns * TAU;
      const start = this.rotation;
      let t0 = null, last = this.segAt(n);
      const step = now => {
        if (t0 === null) t0 = now;
        const t = Math.min(1, (now - t0) / ms);
        this.rotation = start + delta * ease(t);
        this.draw();
        const s = this.segAt(n);
        if (s !== last) { last = s; this.flick(); playTick(); }
        if (t < 1) { requestAnimationFrame(step); return; }
        this.rotation = mod(this.rotation, TAU);
        this.draw();
        resolve(items[this.segAt(n)]);
      };
      requestAnimationFrame(step);
    });
  }
}

/* ================= elements ================= */
const wheel = new Wheel($('#wheelWrap'));
const nameInput = $('#nameInput'), namesEl = $('#names');
const spinBtn = $('#spinBtn'), hub = $('#hub'), lock = $('#lock');
const modal = $('#modal'), closeBtn = $('#closeBtn');
const soundBtn = $('#soundBtn'), fsBtn = $('#fsBtn');

let busy = false;
let freshIdx = -1;

/* ================= rendering ================= */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast(msg || 'Disalin');
}

function renderChips() {
  const el = $('#chips'); el.innerHTML = '';
  const used = usedKeys();
  for (const k of state.order) {
    const c = BY_KEY[k];
    const b = document.createElement('button');
    b.className = 'cchip' + (state.enabled[k] ? '' : ' off') + (state.unique && used.has(k) ? ' used' : '');
    b.dataset.lock = '';
    b.title = state.enabled[k] ? 'Klik untuk buang dari roda' : 'Klik untuk masukkan ke roda';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = swatch(c);
    b.append(dot, c.name);
    b.onclick = () => {
      if (busy) return;
      state.enabled[k] = !state.enabled[k];
      save(); renderChips(); wheel.draw(); updateTurn();
    };
    el.appendChild(b);
  }
  if (busy) el.querySelectorAll('button').forEach(b => { b.disabled = true; });
}

function renderNames() {
  namesEl.innerHTML = '';
  $('#nameCount').textContent = state.names.length;
  $('#namesActions').classList.toggle('hidden', !state.names.length);
  if (!state.names.length) {
    namesEl.innerHTML = '<li class="empty">Belum ada nama.<br>Taip nama di atas dan tekan <b>Enter</b> 👆</li>';
    return;
  }
  const ti = turnIndex();
  state.names.forEach((n, i) => {
    const li = document.createElement('li');
    li.className = 'nrow' + (i === ti ? ' is-turn' : '') + (i === freshIdx ? ' fresh' : '');
    const no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1) + '.';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n.name; nm.title = n.name;
    const res = document.createElement('span');
    if (n.color) {
      const c = BY_KEY[n.color];
      res.className = 'res';
      res.style.background = swatch(c);
      res.style.color = inkFor(c);
      res.textContent = c.name;
    } else if (i === ti) { res.className = 'res wait'; res.textContent = '← giliran'; }
    else { res.className = 'res none'; res.textContent = '—'; }
    li.append(no, nm, res);
    if (n.color) {
      const redo = document.createElement('button');
      redo.className = 'mini'; redo.textContent = '↺'; redo.title = 'Kosongkan warna (pusing semula)';
      redo.disabled = busy;
      redo.onclick = () => { if (busy) return; n.color = null; save(); renderAll(); };
      li.append(redo);
    }
    const del = document.createElement('button');
    del.className = 'mini'; del.textContent = '×'; del.title = 'Buang nama';
    del.disabled = busy;
    del.onclick = () => { if (busy) return; state.names.splice(i, 1); save(); renderAll(); };
    li.append(del);
    namesEl.appendChild(li);
  });
  freshIdx = -1;
  const t = namesEl.querySelector('.is-turn');
  if (t) t.scrollIntoView({ block: 'nearest' });
}

function updateTurn() {
  const ti = turnIndex(), items = wheelItems();
  let msg = '';
  if (!state.names.length) msg = '🔒 Masukkan nama dulu<span>Taip nama dalam senarai Nama, tekan Enter</span>';
  else if (ti < 0) msg = '🎉 Semua nama dah dapat warna<span>Tambah nama lagi atau tekan ↺ Main semula</span>';
  else if (!items.length) msg = state.unique && COLORS.some(c => state.enabled[c.key])
    ? '😅 Warna dah habis<span>Tambah warna atau matikan “satu warna satu orang”</span>'
    : '🎨 Tiada warna dalam roda<span>Hidupkan sekurang-kurangnya satu warna</span>';
  lock.innerHTML = msg ? `<div>${msg}</div>` : '';
  lock.classList.toggle('hidden', !msg);
  hub.style.visibility = msg ? 'hidden' : '';

  const can = !msg && !busy;
  spinBtn.disabled = !can; hub.disabled = !can;
  const label = $('#turnLabel');
  label.textContent = '';
  if (ti >= 0) {
    const b = document.createElement('b'); b.textContent = state.names[ti].name;
    label.append('Giliran: ', b);
    spinBtn.textContent = `🎡 Pusing untuk ${state.names[ti].name}`;
  } else {
    label.textContent = state.names.length ? 'Semua dah siap ✅' : 'Belum ada nama';
    spinBtn.textContent = '🎡 Pusing';
  }
}

function renderAll() { renderNames(); renderChips(); wheel.draw(); updateTurn(); }

function setBusy(b) {
  busy = b;
  document.querySelectorAll('[data-lock]').forEach(el => { el.disabled = b; });
  nameInput.disabled = b;
  namesEl.querySelectorAll('.mini').forEach(el => { el.disabled = b; });
  updateTurn();
}

/* ================= names ================= */
function addNames(list) {
  let added = 0, dup = 0;
  for (let raw of list) {
    const name = raw.trim().slice(0, 40);
    if (!name) continue;
    if (state.names.some(n => n.name.toLowerCase() === name.toLowerCase())) { dup++; continue; }
    state.names.push({ name, color: null });
    freshIdx = state.names.length - 1;
    added++;
  }
  if (dup) toast(dup === 1 ? 'Nama tu dah ada dalam senarai' : `${dup} nama dah ada, tak ditambah`);
  if (added) { save(); renderAll(); }
  return added;
}
function addFromInput() {
  if (busy) return;
  const v = nameInput.value;
  if (!v.trim()) { toast('Taip nama dulu'); nameInput.focus(); return; }
  addNames([v]);
  nameInput.value = '';
  nameInput.focus();
}
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addFromInput(); }
});
nameInput.addEventListener('paste', e => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (/[\r\n\t]/.test(text)) {                       // pasted a column from Excel / a list
    e.preventDefault();
    const n = addNames(text.split(/[\r\n\t]+/));
    if (n) toast(`${n} nama ditambah`);
  }
});
$('#addBtn').onclick = addFromInput;

$('#copyBtn').onclick = () => {
  const lines = state.names.map((n, i) => `${i + 1}. ${n.name} — ${n.color ? BY_KEY[n.color].name : '-'}`);
  copy(lines.join('\n'), 'Keputusan disalin — boleh paste dalam WhatsApp');
};
$('#resetBtn').onclick = () => {
  if (!state.names.some(n => n.color)) return;
  if (!confirm('Kosongkan semua warna dan main semula? (Nama kekal)')) return;
  state.names.forEach(n => { n.color = null; });
  save(); renderAll();
};
$('#clearBtn').onclick = () => {
  if (!confirm('Buang semua nama?')) return;
  state.names = [];
  save(); renderAll(); nameInput.focus();
};

/* ================= colour settings ================= */
$('#shuffleColorsBtn').onclick = () => { state.order = shuffledOrder(); save(); renderChips(); wheel.draw(); };
$('#allColorsBtn').onclick = () => { COLORS.forEach(c => { state.enabled[c.key] = true; }); save(); renderChips(); wheel.draw(); updateTurn(); };
const uniqueChk = $('#uniqueChk');
uniqueChk.onchange = () => { state.unique = uniqueChk.checked; save(); renderChips(); wheel.draw(); updateTurn(); };
const durInput = $('#duration');
durInput.oninput = () => { state.duration = +durInput.value; $('#durLabel').textContent = state.duration; save(); };

/* ================= spin ================= */
function spin() {
  if (busy || !modal.classList.contains('hidden')) return;
  const ti = turnIndex();
  if (!state.names.length) { toast('Masukkan nama dulu'); nameInput.focus(); return; }
  if (ti < 0) { toast('Semua nama dah dapat warna'); return; }
  if (!wheelItems().length) { toast('Tiada warna dalam roda'); return; }
  audio();
  setBusy(true);
  wheel.spin(state.duration * 1000).then(c => {
    state.names[ti].color = c.key;
    freshIdx = ti;
    save();
    setBusy(false);
    renderNames(); renderChips(); updateTurn();
    winSound();
    confetti(c.gold ? ['#F9E08B', '#E6C15A', '#B8892A', '#ffffff', '#D4AF37'] : [c.hex, c.hex, c.hex, '#ffffff', '#F9E08B']);
    showModal(state.names[ti].name, c);
  });
}
spinBtn.onclick = spin;
hub.onclick = spin;
$('#wheelWrap canvas').addEventListener('click', spin);

/* ================= modal ================= */
function showModal(name, c) {
  const top = $('#modalTop');
  top.style.background = swatch(c);
  top.style.color = inkFor(c);
  $('#winKicker').textContent = `🎉 ${name} dapat warna`;
  $('#winTitle').textContent = c.name;
  $('#winSub').textContent = c.hex;
  const next = turnIndex();
  closeBtn.textContent = next >= 0 ? `Seterusnya: ${state.names[next].name} ➜` : 'Siap 🎉';
  modal.classList.remove('hidden');
  closeBtn.focus();
}
function closeModal() {
  modal.classList.add('hidden');
  wheel.draw();                      // colour may have left the wheel ("satu warna satu orang")
  updateTurn();
}
closeBtn.onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

/* ================= confetti ================= */
const cf = $('#confetti'), cfx = cf.getContext('2d');
let cfId = 0;
function confetti(colors) {
  const id = ++cfId;
  const d = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cf.width = W * d; cf.height = H * d; cfx.setTransform(d, 0, 0, d, 0, 0);
  const parts = [];
  for (let i = 0; i < 220; i++) {
    const left = i % 2 === 0;
    parts.push({
      x: left ? -10 : W + 10, y: H * 0.85,
      vx: (left ? 1 : -1) * (3 + rand() * W / 90),
      vy: -Math.sqrt(2 * 0.32 * H * (0.45 + rand() * 0.5)),
      w: 7 + rand() * 6, h: 10 + rand() * 8,
      rot: rand() * TAU, vr: (rand() - 0.5) * 0.35,
      flip: rand() * TAU, vf: 0.08 + rand() * 0.15,
      c: colors[randInt(colors.length)]
    });
  }
  const t0 = performance.now();
  (function frame(now) {
    if (id !== cfId) return;
    cfx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy = Math.min(p.vy + 0.32, 4.5);
      p.vx *= 0.985;
      p.x += p.vx + Math.sin(p.flip) * 0.6; p.y += p.vy;
      p.rot += p.vr; p.flip += p.vf;
      if (p.y > H + 30) continue;
      alive++;
      cfx.save();
      cfx.translate(p.x, p.y); cfx.rotate(p.rot); cfx.scale(1, Math.cos(p.flip));
      cfx.fillStyle = p.c; cfx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cfx.restore();
    }
    if (alive && now - t0 < 7000) requestAnimationFrame(frame);
    else cfx.clearRect(0, 0, W, H);
  })(t0);
}

/* ================= misc ================= */
function renderSound() {
  soundBtn.textContent = state.sound ? '🔊' : '🔇';
  soundBtn.title = state.sound ? 'Bunyi: hidup' : 'Bunyi: mati';
}
soundBtn.onclick = () => { state.sound = !state.sound; renderSound(); save(); };

fsBtn.onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => document.body.classList.toggle('presenting'));
  else document.body.classList.toggle('presenting');
};
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', !!document.fullscreenElement);
});

document.addEventListener('keydown', e => {
  if (!modal.classList.contains('hidden')) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    return;
  }
  const tag = document.activeElement && document.activeElement.tagName;
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); spin(); return; }
  if (e.code === 'Space' && !/^(INPUT|TEXTAREA|BUTTON|SELECT)$/.test(tag)) { e.preventDefault(); spin(); }
});

/* ================= init ================= */
uniqueChk.checked = state.unique;
durInput.value = state.duration; $('#durLabel').textContent = state.duration;
renderSound();
renderAll();
wheel.resize();
})();
</script>
</body>
</html>
